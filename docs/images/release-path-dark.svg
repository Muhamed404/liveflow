<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<rect x=".5" y=".5" width="1199" height="319" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#e6edf3">A production release, step by step</text>
<text x="32" y="60" font-size="13" fill="#9198a1">Nothing reaches prod until someone types “prod” and presses Sync.</text>
