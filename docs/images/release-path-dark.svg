<rect x="32" y="230" width="1136" height="60" rx="10" fill="#161b22" stroke="#30363d"/><rect x="32" y="230" width="1136" height="60" rx="10" fill="#9198a1" fill-opacity=".07"/><clipPath id="c4350"><rect x="32" y="230" width="1136" height="60" rx="10"/></clipPath><rect x="32" y="230" width="1136" height="4" fill="#9198a1" clip-path="url(#c4350)"/><text x="600.0" y="268.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#e6edf3">Roll back = the same path with an older tag: Releases → Roll back → Jenkins ACTION=rollback (no rebuild) → Gate → Sync</text>
