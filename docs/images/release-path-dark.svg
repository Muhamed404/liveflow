<rect x="225.2" y="90" width="170" height="100" rx="10" fill="#161b22" stroke="#30363d"/><rect x="225.2" y="90" width="170" height="100" rx="10" fill="#4493f8" fill-opacity=".07"/><clipPath id="c2916"><rect x="225.2" y="90" width="170" height="100" rx="10"/></clipPath><rect x="225.2" y="90" width="170" height="4" fill="#4493f8" clip-path="url(#c2916)"/><text x="310.2" y="131.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#e6edf3">2 · GitHub tag</text><text x="310.2" y="148.0" text-anchor="middle" font-size="12.5" fill="#9198a1">on the prod</text><text x="310.2" y="165.0" text-anchor="middle" font-size="12.5" fill="#9198a1">branch</text>
