<rect x="611.5999999999999" y="90" width="170" height="100" rx="10" fill="#161b22" stroke="#30363d"/><rect x="611.5999999999999" y="90" width="170" height="100" rx="10" fill="#4493f8" fill-opacity=".07"/><clipPath id="c5621"><rect x="611.5999999999999" y="90" width="170" height="100" rx="10"/></clipPath><rect x="611.5999999999999" y="90" width="170" height="4" fill="#4493f8" clip-path="url(#c5621)"/><text x="696.5999999999999" y="131.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#e6edf3">4 · Values file</text><text x="696.5999999999999" y="148.0" text-anchor="middle" font-size="12.5" fill="#9198a1">values-prod.yaml</text><text x="696.5999999999999" y="165.0" text-anchor="middle" font-size="12.5" fill="#9198a1">gets the new tag</text>
