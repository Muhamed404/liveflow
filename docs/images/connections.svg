<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<rect x=".5" y=".5" width="1199" height="499" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1f2328">How Liveflow connects to your tools</text>
<text x="32" y="60" font-size="13" fill="#59636e">The browser only talks to Liveflow. Liveflow holds the tokens (encrypted) and calls each tool for you.</text>
<rect x="32" y="220" width="190" height="80" rx="10" fill="#ffffff" stroke="#d0d7de"/><rect x="32" y="220" width="190" height="80" rx="10" fill="#6e7781" fill-opacity=".07"/><clipPath id="c3274"><rect x="32" y="220" width="190" height="80" rx="10"/></clipPath><rect x="32" y="220" width="190" height="4" fill="#6e7781" clip-path="url(#c3274)"/><text x="48" y="242.5" text-anchor="start" font-size="14.5" font-weight="650" fill="#1f2328">Browser</text><text x="48" y="259.5" text-anchor="start" font-size="12.5" fill="#59636e">you and your team</text><text x="48" y="276.5" text-anchor="start" font-size="12.5" fill="#59636e">roles: viewer,</text><text x="48" y="293.5" text-anchor="start" font-size="12.5" fill="#59636e">operator, admin</text>
<rect x="262" y="180" width="240" height="160" rx="10" fill="#ffffff" stroke="#d0d7de"/><rect x="262" y="180" width="240" height="160" rx="10" fill="#9a6700" fill-opacity=".07"/><clipPath id="c4414"><rect x="262" y="180" width="240" height="160" rx="10"/></clipPath><rect x="262" y="180" width="240" height="4" fill="#9a6700" clip-path="url(#c4414)"/><text x="278" y="235.0" text-anchor="start" font-size="16" font-weight="650" fill="#1f2328">Liveflow</text><text x="278" y="252.0" text-anchor="start" font-size="12.5" fill="#59636e">one container: API + dashboard</text><text x="278" y="269.0" text-anchor="start" font-size="12.5" fill="#59636e">SQLite in /data</text><text x="278" y="286.0" text-anchor="start" font-size="12.5" fill="#59636e">tokens AES-256-GCM encrypted</text><text x="278" y="303.0" text-anchor="start" font-size="12.5" fill="#59636e">cache 2–5 s per environment</text>
<rect x="640" y="80" width="300" height="58" rx="10" fill="#ffffff" stroke="#d0d7de"/><rect x="640" y="80" width="300" height="58" rx="10" fill="#0969da" fill-opacity=".07"/><clipPath id="c5820"><rect x="640" y="80" width="300" height="58" rx="10"/></clipPath><rect x="640" y="80" width="300" height="4" fill="#0969da" clip-path="url(#c5820)"/><text x="656" y="108.5" text-anchor="start" font-size="14.5" font-weight="650" fill="#1f2328">GitHub</text><text x="656" y="125.5" text-anchor="start" font-size="12.5" fill="#59636e">tags + releases</text>
