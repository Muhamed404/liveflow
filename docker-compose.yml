# Local / single-server run of the dashboard. Secrets come from .env next to this file.
services:
  liveflow:
    build: .
    image: liveflow:latest
    ports:
      - "4000:4000"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (openssl rand -base64 32)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD for the first admin}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}     # true behind HTTPS
      TRUST_PROXY: ${TRUST_PROXY:-}              # 1 behind a load balancer / ingress
    volumes:
      - liveflow-data:/data
    restart: unless-stopped
volumes:
  liveflow-data:
